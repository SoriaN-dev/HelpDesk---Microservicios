quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url= jdbc:postgresql://localhost:5432/helpdesk

quarkus.hibernate-orm.database.default-schema=app_ticket

quarkus.http.port=8090
quarkus.http.host=0.0.0.0

#cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

#Service app-employee
quarkus.stork.employees-api.service-discovery.type=consul
quarkus.stork.employees-api.service-discovery.consul-host=${consul.host}
quarkus.stork.employees-api.service-discovery.consul-port=${consul.port}
quarkus.stork.employees-api.service-discovery.application=app-employee
quarkus.stork.employees-api.service-discovery.refresh-period=5s

#Service app-asset
quarkus.stork.assets-api.service-discovery.type=consul
quarkus.stork.assets-api.service-discovery.consul-host=${consul.host}
quarkus.stork.assets-api.service-discovery.consul-port=${consul.port}
quarkus.stork.assets-api.service-discovery.application=app-asset
quarkus.stork.assets-api.service-discovery.refresh-period=5s


consul.host=127.0.0.1
consul.port=8500

quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-at-start=false
quarkus.flyway.schemas=app_ticket

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.urls.default=/app-ticket/q/openapi
mp.openapi.servers=/app-ticket